# OrderEazi/commerce-sdk -> .github/workflows/release-toolkit.yml
#
# Publishes @ordereazi/commerce-agent-toolkit.
#
# Separate from release.yml for two reasons. The toolkit versions independently - it changes when its
# tools change, not when the API does - and npm allows only ONE trusted publisher per package, so it
# needs its own policy pointing at this filename rather than sharing the SDK's.
#
# Unlike the four SDKs this package is hand-written, but it bundles a snapshot of the store and admin
# OpenAPI documents and every MCP tool answers from that snapshot. So the snapshot is refreshed here
# rather than trusting whatever was committed, and the publish is blocked if the result looks wrong.
name: Release agent toolkit

on:
  push:
    tags: ['toolkit-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 1.1.0)'
        required: true

env:
  OPENAPI_BASE_URL: ${{ vars.OPENAPI_BASE_URL || 'https://commerce-api-alpha.ordereazi.com' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: agent-toolkit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve the version
        id: version
        working-directory: .
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#toolkit-v}"
          fi

          if ! echo "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "Not valid semver: $version"
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Confirm npm is new enough for trusted publishing
        run: |
          required=11.5.1
          actual=$(npm --version)
          lowest=$({ echo "$required"; echo "$actual"; } | sort -V | head -1)
          if [ "$lowest" != "$required" ]; then
            echo "npm $required or newer is required for trusted publishing, got $actual"
            exit 1
          fi
          echo "npm $actual"

      - run: npm ci

      # Refreshed from the live API rather than published as committed. A snapshot that has fallen
      # behind is the failure this package is most exposed to: the tools answer confidently from it,
      # so a stale one ships documentation that is wrong rather than absent.
      - name: Refresh the bundled OpenAPI snapshots
        env:
          API_URL: ${{ env.OPENAPI_BASE_URL }}
        run: bash scripts/refresh-openapi-snapshot.sh

      - run: npm run build
      - run: npm test

      - name: Confirm the bundled snapshots survived the build
        # Guards both halves: that the refresh produced something, and that the build copied it into
        # dist where the compiled code's relative lookups expect it.
        run: |
          for doc in store admin; do
            f="dist/mcp/data/openapi/${doc}.json"
            if [ ! -s "$f" ]; then echo "Missing or empty bundled spec: $f"; exit 1; fi
            paths=$(node -e "console.log(Object.keys(require('./$f').paths || {}).length)")
            echo "$doc: $paths paths"
            if [ "$paths" -lt 1 ]; then echo "$doc snapshot has no paths"; exit 1; fi
          done

      - name: Set the version from the tag
        run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version

      - run: npm publish --access public --provenance
